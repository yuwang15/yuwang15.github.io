<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=syw14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=syw14" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=syw14" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=syw14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="SYW — 成衣与配饰，以卓越品质与持久设计为核心。"
    />
    <!-- Fonts are self-hosted (see scripts/vendor-google-fonts.py): fonts.googleapis.com
         is unreachable from mainland China, and it was blocking first paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/figtree-300-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bodoni-moda-400-normal.woff2"
      crossorigin
    />
    <!-- Hero still, mirroring the srcset ResponsiveImage renders so the preloaded
         response is the one actually used. Keep in sync with responsive.manifest.json. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        /assets/.rsp/hero-main/w720.webp 720w,
        /assets/.rsp/hero-main/w1080.webp 1080w,
        /assets/.rsp/hero-main/w1440.webp 1440w,
        /assets/.rsp/hero-main/w1920.webp 1920w,
        /assets/.rsp/hero-main/w2560.webp 2560w"
      imagesizes="100vw"
    />
    <title>SYW</title>
    <style>
      /* First paint before React: match site bg, avoid black flash */
      html, body, #root { background: #f7f7f5; margin: 0; min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
